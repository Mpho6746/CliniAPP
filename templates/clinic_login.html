{% extends "base.html" %}
{% block title %}Log in — CliniApp{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="brand">
    <span class="brand-mark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <polyline points="2 13 8 13 10.5 6 14 21 16.5 13 22 13" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    CliniApp
  </div>

  <h1>Log in</h1>
  <p class="sub">Welcome back — enter your details to continue.</p>

  <form method="POST" action="{{ url_for('clinic_login') }}">
    <div class="field">
      <label for="hospital_number">Hospital number</label>
      <input type="text" id="hospital_number" name="hospital_number" autofocus required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>

  <p class="hint">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
