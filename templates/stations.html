<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare Clinic</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body class="dash">

<div class="dash-topbar">
  <div class="dash-brand">
    <span class="dash-brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M3 12h18" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
    </span>
    MediCare Clinic
  </div>
</div>

<div style="max-width:640px; margin:0 auto; padding:40px 28px;">
  <div class="dash-card">
    <div class="dash-card-head">
      <div>
        <h3>Stations</h3>
        <div class="dash-card-sub">Choose where you're signing in</div>
      </div>
    </div>
    <div class="station-nav">
      <a class="station-nav-item" href="{{ url_for('admin') }}">
        <span class="station-nav-icon" style="background:#3E7A3E">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke="white" stroke-width="2" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="white" stroke-width="2"/><path d="M19 8v6M22 11h-6" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span>
          <span class="station-nav-name">Admin</span>
          <span class="station-nav-desc">Register patients, manage staff and medications</span>
        </span>
      </a>
      <a class="station-nav-item" href="{{ url_for('doctor_auth') }}">
        <span class="station-nav-icon" style="background:var(--d-blue)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 3v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V3" stroke="white" stroke-width="2"/><rect x="4" y="7" width="16" height="14" rx="2" stroke="white" stroke-width="2"/><path d="M12 12v4M10 14h4" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span>
          <span class="station-nav-name">Doctor</span>
          <span class="station-nav-desc">Review patients, add notes</span>
        </span>
      </a>
      <a class="station-nav-item" href="{{ url_for('nurse_auth') }}">
        <span class="station-nav-icon" style="background:#B14A72">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.9 2.6 5 6.3 5c2 0 3.4 1 4.7 2.6C12.3 6 13.7 5 15.7 5c3.7 0 5.6 3.9 3.8 7.5C21 16.65 12 21 12 21z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
        </span>
        <span>
          <span class="station-nav-name">Nursing</span>
          <span class="station-nav-desc">See every patient's status</span>
        </span>
      </a>
      <a class="station-nav-item" href="{{ url_for('pharmacist') }}">
        <span class="station-nav-icon" style="background:#C07A21">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="white" stroke-width="2"/><path d="M9 9h6v6H9z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
        </span>
        <span>
          <span class="station-nav-name">Pharmacist</span>
          <span class="station-nav-desc">Dispense evaluated orders</span>
        </span>
      </a>
      <a class="station-nav-item" href="{{ url_for('records') }}">
        <span class="station-nav-icon" style="background:#6A4E9C">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4z" stroke="white" stroke-width="2" stroke-linejoin="round"/><path d="M8 9h8M8 13h8M8 17h5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span>
          <span class="station-nav-name">Records</span>
          <span class="station-nav-desc">Search by name, ID, status</span>
        </span>
      </a>
      <a class="station-nav-item" href="{{ url_for('statistics') }}">
        <span class="station-nav-icon" style="background:var(--d-purple)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M12 20V4M20 20v-7" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span>
          <span class="station-nav-name">Statistics</span>
          <span class="station-nav-desc">Snapshot of every stage</span>
        </span>
      </a>
    </div>
  </div>
</div>

</body>
</html>
